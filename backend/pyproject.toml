[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
# B008: function calls in defaults are the FastAPI Depends(...) idiom.
ignore = ["E501", "BLE001", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/", "alembic/", "demo-data/"]
